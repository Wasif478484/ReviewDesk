[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewdesk"
version = "0.1.0"
description = "Owner-in-the-loop review triage assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.30",
  "anthropic>=0.30",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reviewdesk = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]

name: ReviewDesk checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install package
        run: python -m pip install -e .
      - name: Run policy checks
        run: python -m reviewdesk.policy
      - name: Run workflow checks
        run: python -m reviewdesk.autopilot
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Compile Python modules
        shell: bash
        run: python -m compileall -q app.py src/reviewdesk
      - name: Check patch whitespace
        run: git diff --check
